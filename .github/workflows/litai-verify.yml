# Spec gate: project authority and locks must be current, and the spec must validate. These fail the job.
# The committed test receipt is also checked, but a stale receipt only warns. The tool mints a receipt from a file list
# fixed when the project was adopted and refuses to refresh that list at the project's current stage, so no fresh
# receipt can be minted until the tool supports it. The app-tests workflow runs the full suite on every pull request.
name: litai-verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # literate-ai at the exact revision this project's locks, native children and conversion stage were produced with.
      LITAI_SOURCE: git+https://github.com/jordanhubbard/literate-ai@ebf88985be10f733dd64f469b7cd4aa685ce9083
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install litai
        run: python -m pip install "$LITAI_SOURCE"
      - name: Every gate but the receipt is current
        run: litai verify --gate authority --gate locks --gate source-intelligence --gate html-observability
      - name: Spec validates
        run: litai spec validate specs/align --id-prefix align
      - name: Test receipt is current (warns only)
        continue-on-error: true
        run: litai verify --gate receipt
