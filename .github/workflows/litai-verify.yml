# Literate AI gate: the committed test receipt must match the code and tests it covers, and the spec must validate.
# A change to the app, its tests or its harness without a fresh `litai project test-receipt run-retained` fails here;
# it does not run the suite itself (about 25 minutes, with Chromium and a live server).
name: litai-verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Exact verifier supports every qualified child and immutable asset record.
      # The retained application's build driver is pinned separately.
      LITAI_SOURCE: git+https://github.com/jordanhubbard/literate-ai@77be5baf68bbeaf878a5b86151dafffe623beb2e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - name: Readable native source matches accepted cache
        run: node tools/native-rewrite/review-native-sources.mjs
      - name: Effective host tool requirements
        run: python tools/native-rewrite/check-host-tools.py
      - name: Qualification review copies match recorded profiles
        run: python tools/native-rewrite/review-qualification-source.py
      - name: Project instructions and approval scope remain safe
        run: python tools/native-rewrite/check-review-policy.py
      - name: Relocated guards preserve independent acceptance
        run: node --no-warnings --experimental-vm-modules --max-old-space-size=768 tools/native-rewrite/check-relocated-guards.mjs
      - name: Install litai
        run: python -m pip install "$LITAI_SOURCE"
      - name: Receipt, locks and authority are current
        run: litai verify
      - name: Spec validates
        run: litai spec validate specs/align --id-prefix align
