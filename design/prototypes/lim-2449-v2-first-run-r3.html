<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Align v2 R3 · first useful result</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#0c0d10;--panel:#18191e;--elev:#25262e;--stroke:#666a75;--hair:#393b44;--white:#f4f2ee;--muted:#c8c9d1;--pink:#e90095;--blue:#9ec8ff;--violet:#ab94ff;--paper:#f3f0e9}
*{box-sizing:border-box}html,body{margin:0;min-width:0;max-width:100%}
body{font:14px/1.6 'Space Grotesk',sans-serif;background:var(--bg);color:var(--white);overflow-wrap:anywhere}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
h1,h2,h3,p{margin:0}h1{font-size:clamp(29px,3.5vw,45px);line-height:1.12;letter-spacing:-1px;margin:8px 0 13px}h2{font-size:21px;line-height:1.3}h3{font-size:15px}
.mono,.tag,.source,.eyebrow{font-family:'Space Mono',monospace;font-size:10px}.eyebrow{color:#f5addb;font-weight:700;text-transform:uppercase}.source{color:var(--muted);line-height:1.7;margin-top:10px}.tag{border:1px solid var(--stroke);padding:5px 8px;border-radius:4px;display:inline-flex;color:var(--muted);max-width:100%}.sub{color:var(--muted);font-size:13px}.small{color:var(--muted);font-size:11px}
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:195px minmax(0,1fr);min-height:100vh}.rail{padding:23px 13px;border-right:1px solid var(--hair);min-width:0}.logo{font-size:23px;font-weight:700;letter-spacing:-1px}.logo b{color:var(--pink)}.nav{display:grid;gap:6px;margin-top:24px}.nav button{background:transparent;border:1px solid transparent;text-align:left;padding:9px;color:var(--muted);border-radius:5px;font-size:12px;white-space:normal}.nav button[aria-current=page]{background:var(--elev);color:var(--white);border-color:var(--stroke);box-shadow:inset 3px 0 var(--pink)}
.main{min-width:0}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:14px 23px;border-bottom:1px solid var(--hair)}.content{max-width:1060px;margin:auto;padding:27px 24px 45px;min-width:0}.footer{padding:15px 23px;border-top:1px solid var(--hair);font-size:11px;color:var(--muted)}
.panel{border:1px solid var(--hair);background:var(--panel);border-radius:6px;min-width:0}.pad{padding:19px}.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:15px;margin-top:20px}.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cell{padding:15px;background:var(--elev);border:1px solid var(--stroke);border-radius:5px;min-width:0}.cell strong{display:block;font-size:15px;margin:10px 0}
.line{display:flex;justify-content:space-between;align-items:start;gap:14px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:12px}.line strong{max-width:60%;text-align:right}.btn{background:var(--elev);border:1px solid var(--stroke);border-radius:5px;min-height:44px;padding:10px 14px;font-size:12px;font-weight:700}.btn.primary{background:var(--pink);border-color:var(--pink);color:#160714}.btn:disabled{opacity:.45;cursor:not-allowed}.action{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.action .btn{max-width:100%}
.notice{margin-top:15px;padding:11px 13px;border-left:3px solid var(--blue);background:#1d2d43;font-size:12px}.unknown{margin-top:15px;padding:11px 13px;border-left:3px solid var(--violet);background:#282335;font-size:12px}.mismatch{margin-top:16px;padding:17px;background:#2b1725;border:1px solid #915177;border-left:4px solid var(--pink);border-radius:5px}.mismatch h2{margin:6px 0 9px}.code{font:11px/1.65 'Space Mono',monospace;background:#111216;padding:12px;border:1px solid var(--hair);border-radius:4px;display:block;margin:13px 0;overflow-wrap:anywhere}.pick{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.pick label{border:1px solid var(--stroke);background:var(--elev);border-radius:5px;padding:10px 12px;display:inline-flex;gap:8px;align-items:center;min-height:44px}.pick input{accent-color:var(--pink)}.paper{background:var(--paper);color:#17141a;padding:17px;border-radius:4px;border-left:4px solid #774c79}.paper .eyebrow{color:#623a5b}.paper .sub{color:#55505b}
#message{min-height:22px;color:#ffbecb;font-size:12px;margin-top:12px}
@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}.rail{padding:12px;border-right:0;border-bottom:1px solid var(--hair)}.logo{font-size:19px}.nav{display:flex;gap:3px;overflow-x:auto;max-width:100%;margin-top:8px}.nav button{flex:0 0 auto;white-space:nowrap}.content{padding:19px 14px 27px}.top{padding:11px 14px}.columns,.cells{grid-template-columns:1fr}.pad{padding:15px}.footer{padding:12px}}
@media(max-width:390px){.line{display:block}.line strong{display:block;max-width:100%;text-align:left;margin-top:5px}.action{display:grid;grid-template-columns:1fr}.btn{width:100%}.pick label{width:100%}}
</style></head><body><div class="shell"><aside class="rail"><div class="logo">liminal <b>align</b></div><nav id="nav" class="nav" aria-label="R3 stages"></nav><p class="small" style="margin-top:32px">R3 · design study<br>v2 source 02f0e1f<br>All values fictional.</p></aside><div class="main"><header class="top"><strong>Northstar sample / simulated one-agent path</strong><button data-act="reset" class="btn">Restart</button></header><main id="screen" class="content" tabindex="-1"></main><footer class="footer">Scripted HTML prototype: no real accounts, devices, apps, sessions, requests, receipts or network calls. D2 review pending.</footer></div></div><div id="announce" aria-live="polite" role="status" style="position:absolute;left:-9999px"></div><script>
"use strict";
const stages=["start","apps","device","sessions","home","work","options"];
const names={start:"Start",apps:"Apps",device:"Device",sessions:"Session",home:"Home",work:"Affected work",options:"Options"};
function newState(){return {step:"start",path:"sample",sampleAllowed:true,app:false,device:false,hooks:false,shared:false,bound:false,priorReceipt:false,requestType:"checkpoint",request:"none",answer:"none",hold:"none",message:""}}
let S=newState();
function escapeText(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function button(t,a,primary,disabled){return '<button data-act="'+a+'" class="btn '+(primary?'primary':'')+'" '+(disabled?'disabled':'')+'>'+escapeText(t)+'</button>'}
function hero(k,t,p){return '<span class="eyebrow">'+k+'</span><h1>'+t+'</h1><p class="sub">'+p+'</p>'}
function line(k,v){return '<div class="line"><span>'+escapeText(k)+'</span><strong>'+escapeText(v)+'</strong></div>'}
function cell(k,v,source){return '<div class="cell"><span class="eyebrow">'+k+'</span><strong>'+escapeText(v)+'</strong><div class="source">Source: '+escapeText(source)+'</div></div>'}
function notice(s,unknown){return '<div class="'+(unknown?'unknown':'notice')+'">'+s+'</div>'}
const newGoal="Enterprise pilots require SSO and audit logs before self-serve growth";
const oldGoal="Ship self-serve signup for individual users";
function src(){const sample=S.path==="sample";return {newGoal:sample||S.bound,oldDirective:sample||S.priorReceipt,bound:sample||S.bound,oldSource:sample?"Northstar fictional prior v1 applied directive":"Paired-device directive and applied receipt (simulated)",newSource:sample?"Northstar fictional goal version":"Current workspace goal version (simulated)",approver:sample?"Dev Patel · fictional goal approval set":"V2 server approval set · exact names not loaded"}}
function canMismatch(){const x=src();return x.newGoal&&x.oldDirective&&x.bound}
function action(a,value){S.message="";
if(a==="reset"){S=newState();return true}
if(a==="path"){S.path=value==="own"?"own":"sample";S.step="start";return true}
if(a==="gate"){S.sampleAllowed=!S.sampleAllowed;return true}
if(a==="route"){if(!stages.includes(value)){S.message="Unknown page";return false}S.step=value;return true}
if(a==="begin"){if(S.path==="sample"&&!S.sampleAllowed){S.message="The sample is not offered behind a creation-code gate.";return false}S.step=S.path==="sample"?"home":"apps";return true}
if(a==="grant"){S.app=true;S.step="device";return true}
if(a==="skipGrant"){S.step="device";return true}
if(a==="pair"){S.device=true;S.step="sessions";return true}
if(a==="install"){if(!S.device)return false;S.hooks=true;return true}
if(a==="share"){if(!S.device||!S.hooks){S.message="Device and hooks are required before sharing.";return false}S.shared=true;S.bound=true;S.step="home";return true}
if(a==="receipt"){if(!S.bound){S.message="No bound session for the receipt.";return false}S.priorReceipt=true;return true}
if(a==="work"){S.step="work";return true}
if(a==="options"){S.step="options";return true}
if(a==="type"){S.requestType=["checkpoint","replan","switch_goal"].includes(value)?value:"checkpoint";return true}
if(a==="request"){if(S.path!=="sample"){S.message="Requires a real eligible sender and shared session; demo does not send.";return false}S.request=S.requestType;S.answer="none";return true}
if(a==="report"){if(S.request==="none")return false;if(value==="auto_accepted"&&S.request==="switch_goal"){S.message="Switch goal cannot be auto-accepted by an agent; developer acceptance is required.";return false}S.answer=value;return true}
if(a==="hold"){if(S.path!=="sample")return false;S.hold="held";return true}
if(a==="release"){if(S.hold!=="held")return false;S.hold="released";return true}
return false}
function start(){return hero("00 / FIRST RUN","Get one useful answer first.","Choose a fictional sample, or inspect the steps to connect one agent in v2. This preview never touches a real user account.")+
'<section class="panel pad" style="margin-top:19px"><h2>How would you start?</h2><div class="pick"><label><input type="radio" name="path" value="sample" '+(S.path==="sample"?'checked':'')+'> Northstar sample</label><label><input type="radio" name="path" value="own" '+(S.path==="own"?'checked':'')+'> One connected agent</label></div>'+
(S.path==="sample"?line("Sample eligibility",S.sampleAllowed?"No workspaces, no creation code required":"Creation code required · sample unavailable")+
'<label class="small"><input type="checkbox" id="gate" '+(!S.sampleAllowed?'checked':'')+'> Preview hosted creation gate</label>':
notice("Real route: sign in → enter authorized workspace → Apps/Devices. This prototype simulates the connection; it cannot connect to your agent.",false))+
'<div class="action">'+button(S.path==="sample"?"Open sample":"Enter workspace preview","begin",true,S.path==="sample"&&!S.sampleAllowed)+'</div></section>'+
notice("The sample cannot establish what happens in your actual project. When the creation gate is enabled, the real product offers Request access, not a sample.",true)}
function apps(){return hero("01 / APPS","An app grant is not a session.","OAuth lets an AI app read a workspace as a particular person. It does not install hooks or produce a session receipt.")+
'<div class="columns"><section class="panel pad"><h2>Connect an AI app</h2><p class="sub">In v2, copy the MCP URL from Apps, use it in Claude Code or Codex, then authorize the workspace through the OAuth flow.</p><code class="code">Apps → MCP server URL → AI app → OAuth workspace consent</code>'+
line("AI app access",S.app?"Authorized (fictional)":"Not connected")+line("Agent session",S.shared?"Shared separately (fictional)":"Not known")+
'<div class="action">'+button("Simulate app grant and continue","grant",true)+'</div></section><aside class="panel pad"><h3>Separate permissions</h3>'+
notice("Connected apps may read goals using the granted scope; the local device and CLI session-sharing flow is separate. An app read cannot prove execution.",false)+
'<div class="action">'+button("Continue without app OAuth","skipGrant")+'</div></aside></div>'}
function device(){return hero("02 / DEVICES","Pair the machine running the agent.","A local CLI device-code grant is required for reported shared sessions. It is not an OAuth app grant.")+
'<div class="columns"><section class="panel pad"><h2>Pair one device</h2><code class="code">align login</code><p class="sub">The CLI prints a code and verification URL. Sign in recently at /app/device and approve that code.</p>'+
line("Device pairing",S.device?"Paired (fictional)":"Not paired")+'<div class="action">'+button("Simulate paired device","pair",true)+'</div></section>'+
'<aside class="panel pad"><h3>Truth boundary</h3>'+notice("Pairing does not share a session. No prompt, task output, or agent success is observable from pairing alone.",true)+'</aside></div>'}
function sessions(){return hero("03 / SESSIONS","Share one session toward a goal.","Choose the workspace and an eligible goal. The developer explicitly shares the session from the local machine.")+
'<div class="columns"><section class="panel pad"><h2>Install hooks and share</h2><code class="code">align install</code><div class="action">'+button(S.hooks?"Hooks marked installed":"Simulate hook installation","install",!S.hooks,S.hooks)+'</div>'+
'<code class="code">align share --latest --workspace &lt;workspace&gt; --goal &lt;allowed-goal&gt;</code>'+
line("Shared",S.shared?"Yes (fictional)":"Not yet")+line("Bound goal",S.bound?"Enterprise onboarding (fictional)":"Not known")+
'<div class="action">'+button("Simulate share and inspect Home","share",true,!S.hooks)+'</div></section>'+
'<aside class="panel pad"><h3>What enters Align?</h3><p class="sub">Shared session metadata, usage, epoch or governing goal, directives and device receipts. Not prompts or full transcripts.</p>'+
notice("An idle agent may not receive a directive until a hook starts the next sync. Connecting is not evidence of a last applied version.",false)+'</aside></div>'}
function home(){const x=src(),known=canMismatch();return hero("04 / ADAPTIVE HOME","What changed and whose turn is it?","Both work-first and decision-first answers are visible. The first useful result is sourced, never inferred from a green all-aligned badge.")+
'<div class="columns"><section class="panel pad"><h2>'+(known?'An observable mismatch':'Not known yet')+'</h2>'+
(known?'<div class="mismatch"><span class="eyebrow">MISMATCH · E5/E6 MAPPING PROVISIONAL</span><h2>Agents are told to do ≠ now required</h2><p>A stored approved goal and an older applied context differ. This does NOT show what the agent actually did next.</p></div>':
notice("Without a previous applied goal-version receipt, the agent-effective target is Not known. A workspace connection alone cannot establish a mismatch.",true))+
'<div class="cells" style="margin:15px 0">'+cell("NOW REQUIRED",x.newGoal?newGoal:"Not known",x.newGoal?x.newSource:"No readable current goal")+
cell("LAST APPLIED AGENT GOAL",x.oldDirective?oldGoal:"Not known",x.oldDirective?x.oldSource:"No applied receipt recorded")+'</div>'+
line("Who can approve the goal change?",x.approver)+line("Who can launch?", "Unresolved in v2")+
'<div class="action">'+button("Inspect affected work","work",true)+'</div></section>'+
'<aside class="panel pad"><h3>Is the agent stuck?</h3>'+notice("Not known. Applied means the device reported application of a directive, not completed work, actual code quality, or an independently verified switch.",true)+
'<h3 style="margin-top:16px">What about an approved-but-held goal?</h3><p class="sub">Founder-ruled future launch releases the plan to agents. PR #37 does not yet implement that separate version gate. A goal Hold is different from this unresolved release authorization.</p>'+
(S.path==="own"&&S.bound&&!S.priorReceipt?'<div class="action">'+button("Simulate an earlier applied receipt","receipt")+'</div>':'')+'</aside></div>'}
function work(){const x=src();return hero("05 / AFFECTED WORK","Follow the evidence, not a task claim.","Each line names the source and its limit. That is what makes the mismatch actionable without inventing agent observation.")+
'<div class="columns"><section class="panel pad"><h2>Source-linked chain</h2>'+
line("Current required goal",x.newGoal?"Enterprise pilot readiness":"Not known")+
'<div class="source">'+(x.newGoal?escapeText(x.newSource):"No readable goal record")+'</div>'+
line("Shared session",x.bound?"One session bound to onboarding":"Not observed")+
'<div class="source">V2 Sessions · epoch/governing-goal relationship</div>'+
line("Last applied goal_version",x.oldDirective?"v1 · self-serve signup":"Not known")+
'<div class="source">'+escapeText(x.oldDirective?x.oldSource:"No device-reported applied receipt")+'</div>'+
(canMismatch()?'<div class="mismatch"><strong>Potential old-plan exposure</strong><p>The last applied goal context and the latest goal requirement differ. This is not proof that the session kept working on the old task.</p></div>':notice("There is not enough recorded evidence to establish a version mismatch.",true))+
'<div class="action">'+button("Inspect Options and receipt meanings","options",true)+'</div></section>'+
'<aside class="panel pad"><h3>What is actually known?</h3>'+line("Goal change",x.newGoal?"Known in sample/simulation":"Not known")+
line("Binding",x.bound?"Recorded in sample/simulation":"Not known")+
line("Directive reported applied",x.oldDirective?"Yes, fictional":"Not known")+
line("What the agent did afterward","Not observed")+line("Whether it switched now","Not known")+
notice("The fixed Align Patterns E5/E6 sheet was not accessible here; mapping is proposed, not an exact quotation of those patterns.",false)+'</aside></div>'}
function options(){return hero("06 / OPTIONS · AFTER FIRST VALUE","Requests and Hold are different controls.","The R3 pass places these actions here, not in the first-run funnel. Both require real v2 permissions and an actual bound session.")+
'<div class="columns"><section class="panel pad"><h2>Request something of the agent</h2><p class="sub">Approvers or workspace owners can request a checkpoint, replan, or switch_goal. Each per-session answer is a device report.</p>'+
'<div class="pick">'+["checkpoint","replan","switch_goal"].map(t=>'<label><input type="radio" name="requestType" value="'+t+'" '+(S.requestType===t?'checked':'')+'> '+({checkpoint:"Checkpoint",replan:"Replan",switch_goal:"Switch goal"})[t]+'</label>').join("")+'</div>'+
notice(S.requestType==="checkpoint"?"Checkpoint may be auto-accepted by the agent as a safe step.":S.requestType==="replan"?"Replan may draft a proposal automatically; a changed direction still requires developer acceptance.":"Switch goal always requires developer acceptance; never auto-accepted.",false)+
'<div class="action">'+button("Simulate typed request","request",true,S.path!=="sample")+'</div>'+
(S.request!=="none"?line("Request",S.request)+line("Session answer",S.answer==="none"?"Sent, no answer":S.answer==="declined"?"Declined · device report":S.answer==="developer_accepted"?"Accepted by developer · device report":"Accepted by agent · auto_accepted report")+
'<div class="action">'+button(S.request==="switch_goal"?"Simulate developer acceptance":"Simulate agent auto-report",S.request==="switch_goal"?"developerReport":"acceptReport")+button("Simulate declined report","declineReport")+'</div>':'')+
notice("Accepted/Declined is a per-session request answer, not proof the agent completed the task.",true)+'</section>'+
'<aside class="panel pad"><h2>Hold is not Stop</h2><p class="sub">Current v2 goal Hold pauses tools on all affected sessions when its directive is enforced. Stop is per session and has an independent latch.</p>'+
line("Goal hold",S.hold==="none"?"Not held":S.hold==="held"?"Held (fictional)":"Released (fictional)")+
line("Hold/release receipt",S.hold==="held"?"Enforced (fictional)":S.hold==="released"?"Applied (fictional)":"Not observed")+
'<div class="action">'+button(S.hold==="held"?"Simulate Release":"Simulate Hold",S.hold==="held"?"release":"hold",false,S.path!=="sample")+'</div>'+
'<div class="paper" style="margin-top:17px"><span class="eyebrow">PROPOSAL · NOT RULED</span><h2>Could Hold/Release support launch?</h2><p>Not directly. Current v2 can send a new goal_version on approval, while Hold/Release separately pauses or resumes tools. Release does not authorize or publish the approved version. A future mapping needs atomic version-gated publication, defined launch authority, and negative tests.</p></div></aside></div>'}
const renderer={start,apps,device,sessions,home,work,options};
function render(){const e=document.getElementById("screen");e.innerHTML=renderer[S.step]()+ '<p id="message" role="alert">'+escapeText(S.message)+'</p>';document.getElementById("nav").innerHTML=stages.map((s,i)=>'<button data-route="'+s+'" aria-current="'+(s===S.step?'page':'false')+'">'+(i+1)+'. '+names[s]+'</button>').join("");e.focus({preventScroll:true})}
document.addEventListener("click",function(e){const b=e.target.closest("button");if(!b)return;const route=b.dataset.route;const a=b.dataset.act;let result=false;if(route)result=action("route",route);else if(a==="acceptReport")result=action("report","auto_accepted");else if(a==="developerReport")result=action("report","developer_accepted");else if(a==="declineReport")result=action("report","declined");else if(a)result=action(a);render();document.getElementById("announce").textContent=result?"Screen updated: "+S.step:S.message});
document.addEventListener("change",function(e){const t=e.target;if(t.name==="path")action("path",t.value);if(t.id==="gate")action("gate");if(t.name==="requestType")action("type",t.value);render()});
render();
</script></body></html>
