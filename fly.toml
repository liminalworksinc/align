# DRAFT (LIM-2424 L0, not applied): no app, volume, DNS or account exists yet. Sean approves on LIM-2424 first.
# One machine only: locks are in process memory and the volume attaches to a single machine (docs/HOSTING.md).
app = "align-pg-draft"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HOSTED = "1"
  ALIGN_DATA_DIR = "/data"
  ALIGN_HOSTS = "align-pg-draft.fly.dev"
  ALIGN_MAX_WORKSPACES = "25"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[mounts]]
  source = "align_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpus = 1
